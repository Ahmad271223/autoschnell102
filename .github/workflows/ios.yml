# iOS-App fuer den App Store bauen und zu App Store Connect (TestFlight) hochladen.
#
# Warum hier: Apple verlangt Xcode auf einem Mac. Wir haben keinen — der
# GitHub-Runner (macOS) uebernimmt das. Das Projekt liegt in ios-app/ (Capacitor,
# laedt https://app.auto-schnellkauf.de im Vollbild — Inhalte kommen live vom
# Server, eine neue Store-Version braucht es nur bei Name/Symbol/Startseite).
#
# Start: Actions -> "iOS-App bauen" -> "Run workflow" (oder Tag ios-v1.0.0).
# Noetige Secrets (Settings -> Secrets and variables -> Actions), siehe
# ios-app/ANLEITUNG-APP-STORE.md:
#   APPLE_TEAM_ID          Team-ID aus developer.apple.com (10 Zeichen)
#   APPSTORE_KEY_ID        Key-ID des App-Store-Connect-API-Schluessels
#   APPSTORE_ISSUER_ID     Issuer-ID desselben Schluessels
#   APPSTORE_PRIVATE_KEY   Inhalt der .p8-Datei (kompletter Text)
# Optional, falls Apple keine Cloud-Signatur erlaubt:
#   IOS_P12_BASE64 / IOS_P12_PASSWORD   Verteilungszertifikat als .p12 (base64)
name: iOS-App bauen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer (z. B. 1.0.1); leer = wie im Projekt"
        required: false
        default: ""
      hochladen:
        description: "Nach dem Bau zu App Store Connect hochladen"
        type: boolean
        default: true
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ios:
    name: Archiv + Upload
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    env:
      HAT_P12: ${{ secrets.IOS_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Capacitor-Abhaengigkeiten
        run: npm ci --no-audit --no-fund

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Web-Huelle und Pods synchronisieren
        run: npx cap sync ios

      - name: Versionsnummer setzen (optional)
        if: ${{ github.event.inputs.version != '' }}
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = ${VERSION};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 MARKETING_VERSION ios/App/App.xcodeproj/project.pbxproj

      - name: App-Store-Connect-Schluessel ablegen
        env:
          P8: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          test -n "$P8" || { echo "Secret APPSTORE_PRIVATE_KEY fehlt"; exit 1; }
          test -n "$KEY_ID" || { echo "Secret APPSTORE_KEY_ID fehlt"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s\n' "$P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Verteilungszertifikat importieren (nur wenn .p12 hinterlegt)
        if: ${{ env.HAT_P12 == 'true' }}
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORT: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORT" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Archiv bauen
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          test -n "$TEAM_ID" || { echo "Secret APPLE_TEAM_ID fehlt"; exit 1; }
          test -n "$ISSUER_ID" || { echo "Secret APPSTORE_ISSUER_ID fehlt"; exit 1; }
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/App.xcarchive/Products" || { echo "Archiv fehlt — Ende des Protokolls:"; tail -120 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: IPA exportieren
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID_PLATZHALTER/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la "$RUNNER_TEMP/ipa"

      - name: IPA als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: AutoSchnell-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Zu App Store Connect hochladen (TestFlight)
        if: ${{ github.event_name == 'push' || github.event.inputs.hochladen == 'true' }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA="$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Hochgeladen: $(basename "$IPA") — in App Store Connect unter TestFlight sichtbar (Verarbeitung ca. 10-30 Minuten)."

      - name: Schluessel entfernen
        if: always()
        run: rm -rf ~/private_keys
