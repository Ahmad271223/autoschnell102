# Continuous Integration — laeuft bei jedem Push und Pull Request.
# Prueft: Backend bootet gegen echte MongoDB, Selbsttest-Suite gruen,
# Frontend baut fehlerfrei. Erst wenn alles gruen ist, sollte gemergt werden.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Backend (Boot + Tests)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: autoschnell_ci
      JWT_SECRET: ci-nur-zum-testen-nicht-produktiv
      TEST_BASE_URL: http://127.0.0.1:8001
      # Anbieter-Mock: E2E-, Job- und Mandantentests vergleichen echte
      # Ablaeufe, ohne Kleinanzeigen/mobile.de zu belasten.
      MOCK_PROVIDER_FETCH: "true"
      # Admin-/Super-Admin-Seeds fuer tests/test_admin_dashboard.py
      # (nur CI-Testwerte — Produktion setzt eigene in der .env).
      ADMIN_EMAIL: ci-admin@ci.invalid
      ADMIN_PASSWORD: "ci-only-admin-pw-1"
      SUPER_ADMIN_USERNAME: ci-superadmin
      SUPER_ADMIN_PASSWORD: "ci-only-superadmin-pw-1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Abhaengigkeiten installieren
        run: pip install -r backend/requirements-dev.txt
      - name: Abhaengigkeiten auf bekannte Schwachstellen pruefen (pip-audit)
        # Runde 5: Bericht — blockiert (noch) nicht, bis die Altlasten
        # aktualisiert sind; das Ergebnis steht im Job-Log.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off
      - name: Geheimnisse im Arbeitsbaum suchen (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git -s /repo --redact -v
      - name: Backend starten
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 \
            --loop asyncio > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8001/api/health
      - name: Selbsttest-Suite
        working-directory: backend
        run: |
          python -m pytest -v tests/test_smoke.py tests/test_listing_cache.py tests/test_link_jobs.py tests/test_e2e_flow.py tests/test_tenant_isolation.py tests/test_send_idempotenz.py tests/test_foto_parallel.py tests/test_driver_system.py tests/test_kleinanzeigen_service.py tests/test_mobile_service_makes.py tests/test_apify_mobile.py tests/test_datenblatt.py tests/test_apify_autoscout.py tests/test_admin_dashboard.py tests/test_auto_daten.py tests/test_rollen_negativ.py tests/test_kontingent.py tests/test_runde5.py tests/test_backup_restore.py tests/test_produkt.py tests/test_betreiber.py
      - name: Backend-Log bei Fehler zeigen
        if: failure()
        run: tail -100 /tmp/backend.log || true

  frontend:
    name: Frontend (Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Abhaengigkeiten installieren
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Abhaengigkeiten auf bekannte Schwachstellen pruefen (yarn audit)
        continue-on-error: true
        run: yarn audit --level high
      - name: Frontend-Tests
        working-directory: frontend
        run: CI=true yarn test --watchAll=false
      - name: Produktions-Build
        working-directory: frontend
        # CI=false: CRA behandelt Warnungen sonst als Fehler
        run: CI=false yarn build

  docker:
    name: Produktions-Images (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend-Image bauen
        run: docker build ./backend
      - name: Frontend-Image bauen
        run: docker build ./frontend
