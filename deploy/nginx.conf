# AutoSchnell Reverse-Proxy — terminiert HTTPS, reicht echte Client-IP weiter.
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  # Fotos/Snapshots koennen groesser sein — Upload-Limit grosszuegig.
  client_max_body_size 25m;

  # WICHTIG: reicht die echte Client-IP ans Backend (X-Forwarded-For) —
  # dadurch greift der Rate-Limiter pro echtem Nutzer (TRUST_PROXY=true).
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  # UEBERSCHREIBEN statt anhaengen ($proxy_add_x_forwarded_for): sonst
  # koennte ein Angreifer per mitgesendetem X-Forwarded-For beliebige
  # IPs vortaeuschen und das Login-Rate-Limit umgehen.
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # HTTP -> HTTPS erzwingen.
  server {
    listen 80;
    server_name _;
    # Let's-Encrypt-Challenge durchlassen, Rest umleiten.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # API ans Backend.
    location /api/ {
      proxy_pass http://backend:8001;
      proxy_read_timeout 300s;   # Snapshots/PDF + synchrone Apify-Abrufe (bis 180 s) muessen durchkommen
    }

    # Alles andere ans Frontend (SPA).
    location / {
      proxy_pass http://web:80;
    }
  }
}
