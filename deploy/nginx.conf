# AutoSchnell Reverse-Proxy — terminiert HTTPS, reicht echte Client-IP weiter.
# Audit 09/2026 (Punkte 9/10): Host-Allowlist (nur die konfigurierte Domain),
# unbekannte Hosts werden verworfen (444), HTTP leitet auf die FESTE Domain
# um, Sicherheits-Header fuer ALLE Antworten (auch die React-Oberflaeche).
# Die Server-Bloecke liegen in default.conf.template (nginx setzt
# ${PUBLIC_HOST} beim Start per envsubst ein).
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  # Fotos/Snapshots koennen groesser sein — Upload-Limit grosszuegig.
  client_max_body_size 25m;

  # gzip fuer Text-Antworten (HTML/JS/CSS/JSON) — Bilder sind schon komprimiert.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript image/svg+xml;
  gzip_min_length 1024;

  # WICHTIG: reicht die echte Client-IP ans Backend (X-Forwarded-For) —
  # dadurch greift der Rate-Limiter pro echtem Nutzer (TRUST_PROXY=true).
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  # UEBERSCHREIBEN statt anhaengen ($proxy_add_x_forwarded_for): sonst
  # koennte ein Angreifer per mitgesendetem X-Forwarded-For beliebige
  # IPs vortaeuschen und das Login-Rate-Limit umgehen.
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  # TLS-Grundeinstellungen (Mozilla "intermediate")
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_session_timeout 1d;
  ssl_session_cache shared:AutoSchnellSSL:10m;
  ssl_session_tickets off;

  include /etc/nginx/conf.d/*.conf;
}
