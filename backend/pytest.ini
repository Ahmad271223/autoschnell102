# Pruefbericht 20.09.2026 (T-12): bisher gab es weder pytest.ini noch
# conftest.py — Marker waren unregistriert, Skips ohne Grund im Log.
#
# - testpaths: `python -m pytest` aus backend/ findet die Suite ohne Argument.
# - -rs: jeder Skip steht mit Grund im Log (docs/tests/UEBERSPRUNGENE_TESTS.md).
# - -p no:cacheprovider: kein .pytest_cache im Checkout (mehrere Sitzungen
#   im selben Verzeichnis, siehe Speicher "Parallel-Sitzungen").
# - --strict-markers: unbekannte Marker sind ein Fehler. Stand 22.09.2026
#   nutzt die Suite nur die eingebauten Marker parametrize/skipif
#   (Grep 'pytest.mark.' in tests/) und den hier registrierten.
# - filterwarnings=error ist BEWUSST nicht gesetzt: die Abhaengigkeiten
#   (motor, pymongo, reportlab) warnen je nach Version unterschiedlich.
[pytest]
testpaths = tests
addopts = -rs -p no:cacheprovider --strict-markers
markers =
    quelltext: Test prueft nur den Quelltext (inspect.getsource / read_text), kein Verhalten
