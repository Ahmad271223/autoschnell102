# AutoSchnell — Produktions-Stack (ein Server).
# Start:  docker compose up -d --build
# Der Reverse-Proxy (nginx) terminiert HTTPS und reicht die ECHTE Client-IP
# an das Backend weiter (X-Forwarded-For) — deshalb greift der Rate-Limiter
# korrekt (TRUST_PROXY=true im Backend).
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Kein Port nach aussen — nur intern erreichbar.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017}
      - DB_NAME=${DB_NAME:-autoschnell}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-8}
      - TRUST_PROXY=true
      - RATE_LIMIT_EXEMPT_LOOPBACK=false
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - SNAPSHOT_RETENTION_DAYS=${SNAPSHOT_RETENTION_DAYS:-60}
      - BACKUP_DIR=/backups
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - uploads_data:/app/uploads     # Fotos/Vertraege/Snapshots/Unterschriften
      - backups_data:/backups         # taegliche Backups (backup_service.py)
    # Kein Port nach aussen — nur der Proxy spricht mit dem Backend.

  web:
    build:
      context: ./frontend
      args:
        # LEER lassen: api.js baut daraus `${BACKEND}/api` — mit "/api" hier
        # wuerde die App /api/api/... aufrufen. Leer = gleiche Herkunft,
        # der nginx-Proxy leitet /api an das Backend weiter.
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [backend, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro   # hier landen die TLS-Zertifikate

volumes:
  mongo_data:
  uploads_data:
  backups_data:
