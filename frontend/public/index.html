<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>#emergent-badge, [id*="emergent"], [class*="emergent-badge"] { display: none !important; visibility: hidden !important; }</style>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0A0A0A" />
        <meta name="description" content="Autohandel – Fahrer-Portal & Händler-Tools" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Autohandel" />
        <!--
          Content-Security-Policy (defense-in-depth for XSS / localStorage token theft).
          script-src ist auf 'self' beschraenkt (kein unsafe-inline, keine Dritt-
          Skripte): Analyse-Tracking wurde entfernt (Pruefbericht Runde 5, DSGVO), und der
          CRA-Runtime-Chunk wird nicht mehr inline eingebettet (INLINE_RUNTIME_CHUNK=false).
          %REACT_APP_CSP_CONNECT% ist nur in der Entwicklung gesetzt (localhost:8001).
          Schriften (IBM Plex, Cabinet Grotesk) liegen seit 09/2026 lokal unter
          public/fonts/ -> style-src/font-src ohne Google/Fontshare-Origins, keine
          preconnect-Hints mehr (Datenschutz: kein Drittland-Transfer der Besucher-IP).
          Note: frame-ancestors is intentionally omitted here — it is ignored in
          <meta> tags (browser spec). It is enforced via the HTTP header set by
          SecurityHeadersMiddleware in server.py.
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' %REACT_APP_CSP_SCRIPT%; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' %REACT_APP_CSP_CONNECT% https://api.stripe.com; object-src 'none'; base-uri 'self';" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>AutoSchnell</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
            <!-- Runde 5: keine Inline-Skripte (CSP script-src 'self') -> boot.js -->
        <script src="%PUBLIC_URL%/boot.js"></script>
    </body>
</html>
